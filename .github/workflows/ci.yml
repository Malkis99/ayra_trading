name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Fast checks: types, lint, unit tests, migrations (PGlite, in memory), production build
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: node scripts/test-migrations.mjs
      - run: npm run build

  # Server economy (migration 0014) under real concurrency: a throw-away PostgreSQL 16 in a service container (never
  # Supabase or production). PGlite above has one connection; here many sessions run at the same moment.
  db-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql --version
      - run: bash scripts/test-concurrency.sh

  # WATCH-1B.1: real CAS races and account RLS, in a throw-away database, never production.
  watchlist-meta-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AYRA_TEST_DB_LOCAL_ONLY: '1'
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node scripts/test-watchlist-meta-postgres.mjs
      - run: npx vitest run --config vitest.priority-postgres.config.ts

  # Browser tests (slower): mock auth suite and the sign-in suite against a fake Supabase server.
  # No secrets are needed: both use local stand-ins.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Playwright's own image: Chromium and WebKit (iPhone browsers are WebKit) with their system packages already
    # installed. Installing them with apt on the runner hung (twice, 30 min). Keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: e2e (mock auth)
        run: npx playwright test
      - name: e2e (fake Supabase)
        run: npx playwright test -c playwright.supabase.config.ts
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
