<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WATCH-2D · UX proposal</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#101015;color:#e9e4f2}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1100px;margin:auto}a,button{color:#b9a2e5}button,input,select{font:inherit}button{cursor:pointer;background:#292137;border:1px solid #50348f;border-radius:8px;padding:8px 12px;min-height:44px}a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b9a2e5;outline-offset:3px}small,.muted{color:#aaa1b5}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.label{border:1px solid #675188;border-radius:7px;padding:8px 12px;background:#241e30;font-size:12px}.focus{border:1px solid #50348f;border-left:3px solid #7554aa;border-radius:16px;padding:22px;background:linear-gradient(120deg,#211b2d,#19171f 70%)}h1{font:700 24px/1.3 Georgia,serif;margin:0}h2{font-size:14px;margin:0}p{margin:8px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 24px;margin:20px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.row button{padding:4px 10px;font-size:12px}label{display:block;font-size:12px}select,input{display:block;width:100%;min-width:0;min-height:44px;background:#121016;color:inherit;border:1px solid #574667;border-radius:9px;padding:10px 12px}.tag{font-size:11px;color:#b9a2e5}.editor{border-top:1px solid #493653;margin-top:20px;padding-top:16px}.editor .grid{margin:10px 0;gap:10px}.actions{display:flex;flex-wrap:wrap;gap:8px}.list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.pill{padding:6px 10px;background:#15121c;border:1px solid #393040;border-radius:8px;font-size:12px}.locked{color:#aaa1b5}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}.checks label{display:flex;gap:8px;align-items:center;min-height:36px}.checks input{width:16px;height:16px;min-height:0;flex:none}footer{border-top:1px solid #493653;padding-top:14px;margin-top:18px;font-size:12px}.languages{white-space:nowrap}#session-fields{grid-column:1/-1}details{margin-top:12px}summary{cursor:pointer;padding:8px 0} [hidden]{display:none!important}@media(max-width:600px){body{padding:14px}.focus{padding:16px}.grid{grid-template-columns:1fr;gap:14px}.checks{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.label{font-size:11px}}
</style></head><body><main>
<header><div class="label" data-i18n="proposal"></div><nav class="languages" aria-label="Language"><a href="?lang=ru">RU</a> · <a href="?lang=en">EN</a></nav></header>
<section class="focus" aria-labelledby="title"><h1 id="title" data-i18n="title"></h1><p class="muted" data-i18n="subtitle"></p>
<div style="max-width:340px;margin-top:18px"><label for="instrument" data-i18n="instrument"></label><select id="instrument"><option>EUR/USD</option><option>Gold</option></select></div>
<div class="grid">
<div><div class="row"><label for="direction" data-i18n="direction"></label><button type="button" data-manage="direction" data-i18n="manage"></button></div><select id="direction"><option data-i18n="neutral"></option><option data-i18n="bullish"></option><option data-i18n="bearish"></option><option data-i18n="customDirection"></option></select></div>
<div><div class="row"><label for="poi">POI</label><button type="button" data-manage="poi" data-i18n="manage"></button></div><select id="poi"><option data-i18n="customPoi"></option><option>FVG</option><option>Order Block</option><option>Liquidity</option></select><span class="tag" data-i18n="customTag"></span></div>
<div><div class="row"><label for="mss">MSS</label><button type="button" data-manage="mss" data-i18n="manage"></button></div><select id="mss"><option data-i18n="customMss"></option><option data-i18n="waiting"></option><option data-i18n="bullish"></option><option data-i18n="bearish"></option><option data-i18n="notConfirmed"></option></select></div>
<div><div class="row"><label for="session" data-i18n="session"></label><button type="button" data-manage="session" data-i18n="manage"></button></div><select id="session"><option data-i18n="customSession"></option><option>London</option><option>New York</option><option data-i18n="none"></option></select><span class="tag" data-i18n="overnight"></span></div>
</div>
<div class="editor" id="editor"><div class="row"><h2 id="editor-title"></h2><button type="button" id="close" data-i18n="close"></button></div><div class="list"><span class="pill locked" data-i18n="system"></span><span class="pill">FVG</span><span class="pill">Order Block</span><span class="pill">Liquidity</span><span class="pill" id="custom-chip">Breaker Block</span></div>
<div class="grid"><label><span data-i18n="name"></span><input id="name" value="Breaker Block" maxlength="160"></label>
<div id="session-fields" hidden><div class="grid"><label><span data-i18n="start"></span><input type="time" value="23:00"></label><label><span data-i18n="end"></span><input type="time" value="02:00"></label><label><span data-i18n="zone"></span><select><option>Asia/Tokyo</option><option>Europe/London</option><option>America/New_York</option></select></label></div></div></div>
<div class="actions"><button type="button" data-preview-action data-i18n="add"></button><button type="button" data-preview-action data-i18n="rename"></button><button type="button" data-preview-action data-i18n="remove"></button></div><p class="muted" data-i18n="deleteHint"></p><p class="muted" role="status" id="preview-state" data-i18n="notSaved"></p></div>
<h2 style="margin-top:20px" data-i18n="checklist"></h2><div class="checks"><label><input type="checkbox"><span data-i18n="poiCheck"></span></label><label><input type="checkbox"><span data-i18n="sweep"></span></label><label><input type="checkbox"><span data-i18n="displacement"></span></label><label><input type="checkbox"><span data-i18n="mssCheck"></span></label><label><input type="checkbox"><span data-i18n="test"></span></label><label><input type="checkbox"><span data-i18n="reaction"></span></label></div>
<details><summary data-i18n="notifications"></summary><p class="muted" data-i18n="disabled"></p></details>
<footer><p data-i18n="local"></p><small data-i18n="disclaimer"></small></footer></section>
</main><script>
const words={ru:{proposal:'UX-макет WATCH-2D · Не реализовано · Данные не сохраняются',title:'Рыночный фокус',subtitle:'Один компактный блок после списка инструментов и котировок',instrument:'Инструмент',direction:'Направление рынка',session:'Торговая сессия',manage:'+ / Управление',customDirection:'Пример: пользовательское направление',customPoi:'Breaker Block · пример',customMss:'CHoCH · пример',customSession:'Ночной фокус · пример',none:'Нет',customTag:'Пользовательский тип · стабильный ID',overnight:'23:00 → 02:00 (+1 день) · Asia/Tokyo',close:'Закрыть',system:'Системные · защищены',name:'Название пользовательского типа',start:'Начало',end:'Конец',zone:'Часовой пояс IANA',add:'Создать',rename:'Переименовать',remove:'Удалить…',deleteHint:'Предложение: подтверждение и сохранение используемого значения через tombstone. Скрытой замены не будет.',notSaved:'Это макет. Действия не изменяют IndexedDB и не подтверждают сохранение.',checklist:'Пользовательский чек-лист',notifications:'Локальные напоминания',disabled:'Для пользовательской сессии выключены. Временная модель и миграция требуют реализации и тестов. Стандартные London/New York остаются по календарю AYRA.',local:'Предлагается локальное хранение с изоляцией аккаунта / Guest. Облачной синхронизации нет.',disclaimer:'Не является финансовой рекомендацией. Автоматический анализ отсутствует.'},en:{proposal:'WATCH-2D UX proposal · Not implemented · Changes are not saved',title:'Market Focus',subtitle:'One compact block after the instrument list and quotes',instrument:'Instrument',direction:'Market direction',session:'Trading session',manage:'+ / Manage',customDirection:'Example: custom direction',customPoi:'Breaker Block · example',customMss:'CHoCH · example',customSession:'Overnight focus · example',none:'None',customTag:'Custom type · stable ID',overnight:'23:00 → 02:00 (+1 day) · Asia/Tokyo',close:'Close',system:'System · protected',name:'Custom type name',start:'Start',end:'End',zone:'IANA time zone',add:'Create',rename:'Rename',remove:'Delete…',deleteHint:'Proposed: confirmation and retained used references via tombstones. No silent replacement.',notSaved:'This is a prototype. Actions do not change IndexedDB or confirm saving.',checklist:'Custom checklist',notifications:'Local reminders',disabled:'Disabled for custom sessions. Time semantics and migration need implementation and testing. Standard London/New York keep using the AYRA calendar.',local:'Proposed account / Guest isolated local storage. No cloud sync.',disclaimer:'Not financial advice. No automatic analysis.'}};
Object.assign(words.ru,{neutral:"Нейтральное",bullish:"Бычье",bearish:"Медвежье",waiting:"Ожидаем",notConfirmed:"Не подтверждено",poiCheck:"POI достигнута",sweep:"Снятие ликвидности",displacement:"Импульс",mssCheck:"MSS/CISD",test:"Возврат / Тест",reaction:"Реакция"});Object.assign(words.en,{neutral:"Neutral",bullish:"Bullish",bearish:"Bearish",waiting:"Waiting",notConfirmed:"Not Confirmed",poiCheck:"POI reached",sweep:"Liquidity Sweep",displacement:"Displacement",mssCheck:"MSS/CISD",test:"Retracement/Test",reaction:"Reaction"});
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'ru',t=words[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
const names={poi:'POI',direction:t.direction,mss:'MSS',session:t.session},samples={poi:'Breaker Block',mss:'CHoCH',direction:lang==='ru'?'Пользовательское направление':'Custom direction',session:lang==='ru'?'Ночной фокус':'Overnight focus'};let caller=null;
function manage(kind){const list=document.querySelector('.list');list.replaceChildren();for(const label of [t.system,...({poi:['FVG','Order Block','Liquidity'],direction:[t.bullish,t.bearish,t.neutral],mss:[t.waiting,t.bullish,t.bearish,t.notConfirmed],session:['London','New York',t.none]})[kind]]){const chip=document.createElement('span');chip.className='pill locked';chip.textContent=label;list.appendChild(chip);}const custom=document.createElement('span');custom.id='custom-chip';custom.className='pill';list.appendChild(custom);document.getElementById('editor').hidden=false;document.getElementById('editor-title').textContent=names[kind];document.getElementById('name').value=samples[kind];document.getElementById('custom-chip').textContent=samples[kind];document.getElementById('session-fields').hidden=kind!=='session';}
document.querySelectorAll('[data-manage]').forEach(b=>b.onclick=()=>{caller=b;manage(b.dataset.manage);document.getElementById('name').focus();});
function closeEditor(){document.getElementById('editor').hidden=true;if(caller)caller.focus();}
document.getElementById('close').onclick=closeEditor;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();});document.querySelectorAll('[data-preview-action]').forEach(b=>b.onclick=()=>{document.getElementById('preview-state').textContent=t.notSaved;});manage('poi');
</script></body></html>
